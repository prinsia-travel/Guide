<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇹🇳 Tunisia — Our 10-Day Road Trip Itinerary</title>
<style>
:root{
  --blue:#087ea4; --deep:#073b4c; --sand:#f7e7c6; --coral:#ef6f61;
  --sun:#f4b942; --cream:#fffaf0; --ink:#18323a; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef7f8;line-height:1.55}
.container{max-width:980px;margin:auto;padding:24px}
.hero{background:linear-gradient(135deg,#073b4c 0%,#087ea4 55%,#4bb3c9 100%);color:white;border-radius:28px;padding:55px 34px;margin-bottom:24px;position:relative;overflow:hidden}
.hero:after{content:"☀️  🌊  🏜️";position:absolute;right:25px;bottom:20px;font-size:34px;opacity:.85}
.kicker{text-transform:uppercase;letter-spacing:2px;font-weight:700;font-size:13px;color:#ffe29a}
h1{font-size:52px;line-height:1;margin:12px 0}
.hero p{font-size:18px;max-width:680px}
.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:8px 12px;border-radius:999px;font-size:13px}
.card{background:white;border-radius:22px;padding:25px;margin:18px 0;box-shadow:0 8px 30px rgba(7,59,76,.08)}
h2{font-size:28px;margin:0 0 14px;color:var(--deep)}
h3{font-size:20px;color:var(--deep);margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.info{background:var(--cream);border-left:6px solid var(--sun);padding:16px;border-radius:14px}
.tip{background:#e5f6f8;border-left:6px solid var(--blue);padding:16px;border-radius:14px}
.warning{background:#fff1ed;border-left:6px solid var(--coral);padding:16px;border-radius:14px}
.day{border:1px solid #e1ecee;border-radius:18px;overflow:hidden;margin:15px 0;background:white}
.dayhead{padding:15px 18px;color:white;background:linear-gradient(90deg,var(--deep),var(--blue));font-weight:800;font-size:18px}
.daybody{padding:18px}
ul{padding-left:21px}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.place{background:#e8f6f8;color:var(--deep);padding:8px 12px;border-radius:999px;font-weight:700}
.arrow{color:var(--coral);font-weight:900}
.check{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check div{background:#f8fbfb;padding:10px 12px;border-radius:10px}
.cta{background:linear-gradient(135deg,#ef6f61,#f4b942);color:white;border-radius:22px;padding:28px;text-align:center;margin-top:22px}
.button{display:inline-block;background:white;color:#c64d43;text-decoration:none;font-weight:800;padding:13px 19px;border-radius:999px;margin-top:10px}
.small{font-size:13px;color:#587079}
footer{text-align:center;padding:25px;color:#60757b;font-size:13px}
@media(max-width:700px){
